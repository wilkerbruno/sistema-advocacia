{% extends "base.html" %}
{% block titulo %}Nova tarefa — JusControl{% endblock %}
{% block eyebrow %}Equipe{% endblock %}
{% block cabecalho %}Nova tarefa{% endblock %}

{% block conteudo %}
<div class="card-doc tab p-4" style="max-width: 700px;">
  <form method="post">
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label">Título *</label>
        <input type="text" name="titulo" class="form-control" required>
      </div>
      <div class="col-12">
        <label class="form-label">Descrição</label>
        <textarea name="descricao" class="form-control"></textarea>
      </div>
      {% if unidades %}
      <div class="col-md-4">
        <label class="form-label">Unidade</label>
        <select name="unidade_id" class="form-select">
          {% for u in unidades %}<option value="{{ u.id }}">{{ u.codigo }} — {{ u.nome }}</option>{% endfor %}
        </select>
      </div>
      {% endif %}
      <div class="col-md-4">
        <label class="form-label">Responsável</label>
        <select name="responsavel_id" class="form-select">
          <option value="">Eu mesmo</option>
          {% for e in equipe %}<option value="{{ e.id }}">{{ e.nome }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Processo relacionado</label>
        <select name="processo_id" class="form-select">
          <option value="">Nenhum</option>
          {% for p in processos %}<option value="{{ p.id }}">{{ p.numero_processo or p.numero_interno }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Prioridade</label>
        <select name="prioridade" class="form-select">
          <option value="normal">Normal</option>
          <option value="alta">Alta</option>
          <option value="urgente">Urgente</option>
          <option value="baixa">Baixa</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Data de vencimento</label>
        <input type="date" name="data_vencimento" class="form-control">
      </div>
    </div>
    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn btn-brass">Criar tarefa</button>
      <a href="{{ url_for('tarefas.listar') }}" class="btn btn-outline-doc">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
