<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Sistema de Advocacia</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/estilo.css') }}" rel="stylesheet">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-mark">Jus<span style="color: var(--brass-500);">Control</span><small>Gestão de escritório de advocacia</small></div>

      {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% if mensagens %}
          {% for categoria, msg in mensagens %}
            <div class="alert alert-{{ categoria }} py-2 px-3 small mt-3 mb-0">{{ msg }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" class="mt-4">
        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input type="email" name="email" class="form-control" required autofocus placeholder="voce@escritorio.com.br">
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input type="password" name="senha" class="form-control" required placeholder="••••••••">
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="lembrar" id="lembrar">
          <label class="form-check-label small text-muted-doc" for="lembrar">Manter conectado</label>
        </div>
        <button type="submit" class="btn btn-brass w-100">Entrar</button>
      </form>
      <p class="text-center text-muted-doc small mt-4 mb-0">Acesso restrito à equipe do escritório.</p>
    </div>
  </div>
</body>
</html>
